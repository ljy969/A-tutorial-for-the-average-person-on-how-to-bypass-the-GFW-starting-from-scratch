<svg xmlns="http://www.w3.org/2000/svg" width="940" height="280" viewBox="0 0 940 280" role="img" aria-labelledby="t d" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC','Segoe UI',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">科学上网整体流程</title>
  <desc id="d">四个步骤：准备客户端、获取节点、导入并连接、测速与检测。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#475569"/>
    </marker>
    <linearGradient id="b1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1e40af"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#047857"/><stop offset="100%" stop-color="#065f46"/></linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b45309"/><stop offset="100%" stop-color="#78350f"/></linearGradient>
    <linearGradient id="b4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#db2777"/><stop offset="100%" stop-color="#9d174d"/></linearGradient>
  </defs>

  <rect width="940" height="280" rx="16" fill="#f8fafc"/>
  <text x="470" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">科学上网整体流程</text>

  <line x1="205" y1="150" x2="250" y2="150" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="435" y1="150" x2="480" y2="150" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="665" y1="150" x2="710" y2="150" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="25" y="95" width="180" height="110" rx="14" fill="url(#b1)"/>
    <circle cx="55" cy="125" r="16" fill="#fff"/>
    <text x="55" y="131" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e40af">1</text>
    <text x="123" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">准备客户端</text>
    <text x="115" y="150" text-anchor="middle" font-size="13" fill="#fff">官方仓库下载工具</text>
    <text x="115" y="172" text-anchor="middle" font-size="12" fill="#dbeafe">Win / macOS / Linux</text>
    <text x="115" y="190" text-anchor="middle" font-size="12" fill="#dbeafe">iOS / Android</text>
  </g>

  <g>
    <rect x="255" y="95" width="180" height="110" rx="14" fill="url(#b2)"/>
    <circle cx="285" cy="125" r="16" fill="#fff"/>
    <text x="285" y="131" text-anchor="middle" font-size="18" font-weight="bold" fill="#047857">2</text>
    <text x="353" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">获取节点</text>
    <text x="345" y="150" text-anchor="middle" font-size="13" fill="#fff">订阅链接 / 节点</text>
    <text x="345" y="172" text-anchor="middle" font-size="12" fill="#d1fae5">GitHub · YouTube</text>
    <text x="345" y="190" text-anchor="middle" font-size="12" fill="#d1fae5">或自建节点（推荐）</text>
  </g>

  <g>
    <rect x="485" y="95" width="180" height="110" rx="14" fill="url(#b3)"/>
    <circle cx="515" cy="125" r="16" fill="#fff"/>
    <text x="515" y="131" text-anchor="middle" font-size="18" font-weight="bold" fill="#b45309">3</text>
    <text x="583" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">导入并连接</text>
    <text x="575" y="150" text-anchor="middle" font-size="13" fill="#fff">导入订阅 / 节点</text>
    <text x="575" y="172" text-anchor="middle" font-size="12" fill="#fef3c7">选延迟最低的节点</text>
    <text x="575" y="190" text-anchor="middle" font-size="12" fill="#fef3c7">开启系统代理 / TUN</text>
  </g>

  <g>
    <rect x="715" y="95" width="180" height="110" rx="14" fill="url(#b4)"/>
    <circle cx="745" cy="125" r="16" fill="#fff"/>
    <text x="745" y="131" text-anchor="middle" font-size="18" font-weight="bold" fill="#be185d">4</text>
    <text x="813" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">测速与检测</text>
    <text x="805" y="150" text-anchor="middle" font-size="13" fill="#fff">SpeedTest 测速</text>
    <text x="805" y="172" text-anchor="middle" font-size="12" fill="#fce7f3">ippure IP 纯净度检测</text>
    <text x="805" y="190" text-anchor="middle" font-size="12" fill="#fce7f3">DNS 泄漏自查</text>
  </g>

  <text x="470" y="245" text-anchor="middle" font-size="13" fill="#475569">按顺序完成四个步骤即可开始使用；建议优先使用自建节点，并阅读文末的安全建议。</text>
</svg>
