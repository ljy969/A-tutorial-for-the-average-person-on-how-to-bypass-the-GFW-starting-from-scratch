<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" role="img" aria-labelledby="t d" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC','Segoe UI',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">工作原理示意：流量如何绕过 GFW</title>
  <desc id="d">你的设备与境外网站之间隔着 GFW 防火墙。直连会被拦截；设备先通过加密连接把流量送到境外节点服务器，再由节点访问境外互联网，返回数据沿原路回传。</desc>
  <defs>
    <marker id="ar" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#0284c7"/>
    </marker>
    <marker id="ar2" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="xr" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L12,12 M12,2 L2,12" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
    </marker>
    <pattern id="brick" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#fee2e2"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#fca5a5" stroke-width="3"/>
    </pattern>
  </defs>

  <rect width="920" height="340" rx="16" fill="#f8fafc"/>
  <text x="460" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">工作原理示意：流量如何绕过 GFW</text>

  <!-- GFW wall (between domestic and overseas) -->
  <rect x="300" y="80" width="40" height="190" rx="6" fill="url(#brick)" stroke="#dc2626" stroke-width="2"/>
  <text x="320" y="68" text-anchor="middle" font-size="15" font-weight="bold" fill="#b91c1c">GFW 防火墙</text>

  <!-- Box A: device -->
  <rect x="30" y="150" width="170" height="110" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="115" y="190" text-anchor="middle" font-size="17" font-weight="bold" fill="#075985">你的设备</text>
  <text x="115" y="216" text-anchor="middle" font-size="13" fill="#0c4a6e">电脑 / 手机</text>
  <text x="115" y="238" text-anchor="middle" font-size="12" fill="#0c4a6e">安装客户端工具</text>

  <!-- Box B: node -->
  <rect x="440" y="150" width="170" height="110" rx="14" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
  <text x="525" y="190" text-anchor="middle" font-size="17" font-weight="bold" fill="#047857">海外节点服务器</text>
  <text x="525" y="216" text-anchor="middle" font-size="13" fill="#064e3b">订阅 / 自建</text>
  <text x="525" y="238" text-anchor="middle" font-size="12" fill="#064e3b">位于境外（如 VPS）</text>

  <!-- Box C: internet -->
  <rect x="720" y="150" width="170" height="110" rx="14" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="805" y="190" text-anchor="middle" font-size="17" font-weight="bold" fill="#854d0e">境外互联网</text>
  <text x="805" y="216" text-anchor="middle" font-size="13" fill="#713f12">Google / YouTube</text>
  <text x="805" y="238" text-anchor="middle" font-size="12" fill="#713f12">GitHub 等</text>

  <!-- direct connection: blocked at the wall -->
  <path d="M115,150 L115,112 L294,112" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#xr)"/>
  <text x="205" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">直连：被拦截</text>

  <!-- encrypted tunnel A -> B (passes through the wall) -->
  <line x1="200" y1="205" x2="435" y2="205" stroke="#0284c7" stroke-width="3.5" marker-end="url(#ar)"/>
  <text x="388" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#075985">① 加密连接</text>

  <!-- B -> C -->
  <line x1="610" y1="205" x2="715" y2="205" stroke="#059669" stroke-width="3.5" marker-end="url(#ar2)"/>
  <text x="662" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#047857">② 访问外网</text>

  <text x="460" y="294" text-anchor="middle" font-size="14" fill="#b91c1c">流量经「节点服务器」转发，绕过 GFW 的检测与封锁；返回数据沿原路回传</text>
  <text x="460" y="320" text-anchor="middle" font-size="12" fill="#475569">提示：节点到目标网站这一段是否加密取决于网站本身，建议只访问 HTTPS 网站</text>
</svg>
